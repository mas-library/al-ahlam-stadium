.footer{border-color:rgba(40,16,63,.12);color:#746A7E}
.footer-brand{display:flex;align-items:center;gap:12px}
.footer-brand .stadium-mark{width:39px;height:39px;display:block}
.footer-brand img{object-fit:contain}
.footer a:hover{color:#7BA127}
.stadium-mark{display:inline-flex;align-items:center;justify-content:center;border:0!important;background:transparent!important;border-radius:50%!important;overflow:visible!important;flex:none}
.stadium-mark img,.stadium-mark svg{display:block!important;width:100%!important;height:100%!important;object-fit:contain!important;max-width:100%;max-height:100%;border-radius:0!important}
.stadium-mark svg{view-transition-name:stadium-brand}

/* Customer: a cinematic stadium experience, with usable booking screens. */
body.is-home .dream-shell{max-width:1480px}
.dream-header{height:82px;position:relative;z-index:30;display:flex;align-items:center;gap:25px;justify-content:space-between;margin-top:20px;padding:10px 24px;background:#26123A;border:1px solid rgba(255,255,255,.10);border-radius:25px;box-shadow:0 16px 40px rgba(4,1,10,.15)}
.dream-brand{display:flex;align-items:center;gap:12px;color:#fff;font-weight:850;font-size:19px;line-height:1.2;white-space:nowrap}
.dream-brand strong{display:block;color:#C7F542;font-weight:850}
.dream-emblem{width:53px;height:53px!important}
.dream-nav{display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:5px;background:rgba(10,4,20,.2)}
.dream-nav button{border-radius:11px;padding:10px 19px;color:#E5DCEF;background:transparent;font-size:13px;opacity:.85;font-weight:650}
.dream-nav button.active,.dream-nav button:hover{background:#C7F542;color:#28103F;opacity:1}
.dream-nav button:after{display:none!important}
.dream-account{width:46px;height:46px;border-radius:15px;background:rgba(199,245,66,.10);color:#C7F542;border:1px solid rgba(199,245,66,.28);display:grid;place-items:center}
.dream-account:hover{background:#C7F542;color:#28103F}
.dream-home{padding-bottom:25px}
.dream-hero{position:relative!important;display:flex!important;align-items:center;min-height:615px;margin:23px 0 0!important;border-radius:34px;overflow:hidden;isolation:isolate;border:1px solid rgba(255,255,255,.12);background:#130B20;box-shadow:0 27px 70px rgba(0,0,0,.25)}
.dream-photo{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;border-radius:0!important;min-height:0!important;overflow:hidden;z-index:-2;background:#130B20}
.dream-photo img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 53%!important;filter:saturate(.95) contrast(1.12)}
.dream-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(19,8,32,.40),rgba(19,8,32,.85) 65%),linear-gradient(0deg,rgba(16,8,26,.78),transparent 45%);pointer-events:none}
.dream-photo>span{position:absolute;bottom:28px;left:30px;z-index:3;border:1px solid rgba(255,255,255,.25);background:rgba(21,11,32,.55);color:#fff;backdrop-filter:blur(12px);padding:10px 15px;border-radius:30px;font-size:12px}
.dream-headline{position:relative;z-index:2;padding:clamp(25px,5vw,76px);max-width:850px;align-items:flex-start!important;color:#fff}
.dream-eyebrow{font-size:13px!important;color:#C7F542!important;background:rgba(199,245,66,.12);border:1px solid rgba(199,245,66,.28);border-radius:30px;padding:8px 15px;display:inline-flex;align-items:center;letter-spacing:0!important}
.dream-headline h1{font-size:clamp(62px,9vw,124px)!important;font-weight:900!important;line-height:1.05!important;letter-spacing:-5px!important;max-width:780px;margin:25px 0 15px}
.dream-headline h1 span{color:#C7F542!important}
.dream-headline p{font-size:clamp(16px,2vw,23px)!important;line-height:1.7;color:#F1EAF5;opacity:.95!important;max-width:460px;margin:15px 0 25px!important}
.dream-desktop-cta{background:#C7F542!important;color:#28103F!important;border-color:#C7F542!important;padding:16px 28px!important;border-radius:15px!important}
.dream-planner{position:relative;z-index:4;width:min(1100px,calc(100% - 64px));margin:-65px auto 55px!important;background:#fff!important;color:#28103F;border-radius:30px!important;border:1px solid rgba(40,16,63,.08);box-shadow:0 30px 80px rgba(0,0,0,.26);padding:clamp(22px,3.3vw,42px)!important}
.dream-section-title{display:flex;align-items:center;gap:14px;margin-bottom:25px}
.dream-section-title h2{font-size:clamp(23px,2.7vw,31px);font-weight:900;color:#28103F}
.dream-section-title p{font-size:13px;color:#82768E!important;opacity:1}
.dream-icon{background:#28103F!important;color:#C7F542!important;border-radius:16px!important;width:53px!important;height:53px!important;display:grid;place-items:center}
.dream-days{display:flex;gap:11px;overflow:auto;padding:4px 1px 14px;scroll-snap-type:x proximity}
.dream-days button{flex:1 0 100px;min-width:100px;background:#F5F2F8;color:#28103F;border:1px solid transparent;border-radius:17px;padding:10px 12px;scroll-snap-align:start}
.dream-days button strong{font-size:27px!important;font-weight:900}
.dream-days button small{font-size:11px}
.dream-days button.active{background:#28103F!important;color:#fff!important;box-shadow:0 10px 22px rgba(40,16,63,.16)}
.dream-time-label{margin-top:14px;display:flex;align-items:center;gap:12px;color:#28103F}
.dream-time-label h3{font-size:17px;font-weight:850}
.dream-time-label span{margin-inline-start:auto;color:#796A82;font-size:12px}
.dream-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-top:18px}
.dream-slots button{min-height:60px;border:1px solid #E7E2EC;border-radius:14px;background:#fff;color:#28103F;font-weight:800;font-size:15px}
.dream-slots button.active,.dream-slots button[aria-pressed=true]{background:#C7F542!important;color:#28103F!important;border-color:#C7F542!important}
.dream-slots button:hover{border-color:#C7F542}
.dream-all{display:inline-flex;align-items:center;gap:8px;color:#5E387C!important;font-size:13px!important;background:none!important;font-weight:750;margin-top:14px}
.dream-pricebar{background:#F6F3F9;border-radius:17px;padding:17px 20px;margin-top:20px;border:1px solid #EEE8F3;display:flex;align-items:center;justify-content:space-between;gap:15px}
.dream-pricebar strong{color:#28103F;font-size:24px;font-weight:900}
.dream-pricebar small{display:block;color:#746A80;font-size:12px}
.dream-payment{display:flex;align-items:center;gap:10px;color:#5F5070;font-size:12px}
.dream-payment strong{font-size:13px}
.dream-book{width:100%;background:#C7F542!important;border-color:#C7F542!important;color:#28103F!important;padding:13px!important;margin-top:18px;border-radius:15px!important}
.dream-fineprint{text-align:center!important;color:#857A8C!important;font-size:11px!important;margin-top:12px!important}
.dream-photo-note{color:rgba(255,255,255,.5)!important;text-align:center;font-size:11px}
body.is-home .footer{border-color:rgba(255,255,255,.13);color:#CEC5D5}
body.is-home .footer a{color:#C7F542}
body.is-home .footer-brand strong{color:white}
body.is-home .footer-brand small{color:#ACA1B7}
body:not(.is-home) .dream-header{margin-bottom:8px}

/* App modules: booking, tournaments, account and authentication. */
.layout2{gap:26px}
.summary .visual{background:linear-gradient(130deg,#28103F,#4A246D);border-radius:18px;height:145px}
.summary{border-radius:24px}
.price{color:#28103F;font-weight:900}
.booking-card{border:1px solid rgba(40,16,63,.09);border-radius:20px;background:#fff;box-shadow:var(--shadow)}
.booking-card .date-block{background:#28103F;color:#fff;border-radius:14px}
.cup-card{position:relative;overflow:hidden}
.cup-card:before{content:"";position:absolute;top:0;right:0;left:0;height:5px;background:#C7F542}
.cup-card .ico{color:#704191}
.cup-card .btn{margin-top:20px}
.auth-art{background:linear-gradient(135deg,#28103F,#4C226B);border-radius:25px!important}
.authform{border-radius:25px}
.modal{border-radius:24px}
.bottomnav{box-shadow:0 -10px 30px rgba(25,11,44,.07)}
.bottomnav button.active{color:#28103F}
.bottomnav button.active .ico{stroke:#6F9F23}

/* Admin: high-contrast navigation and a spacious operational workspace. */
body.admin{background:#F4F3F7;color:#28103F}
.admin-shell{min-height:100vh;background:#F4F3F7;display:grid;grid-template-columns:275px minmax(0,1fr)}
.sidebar{background:#211035!important;color:#F3EAFB!important;min-height:100vh;border:0!important;padding:28px 17px!important;display:flex;flex-direction:column;gap:7px;box-shadow:12px 0 40px rgba(26,12,43,.08)}
.sidebar .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px!important;padding:5px 9px;color:#fff!important;font-weight:850;font-size:17px}
.sidebar .brand small{color:#BFAED1;font-size:10px;display:block;font-weight:500}
.sidebar .brandmark{height:53px;width:53px;object-fit:contain;border-radius:0;background:transparent}
.sidebar>button{width:100%;display:flex;align-items:center;gap:14px;padding:14px 17px;border-radius:15px!important;background:transparent!important;color:#D6C5E3!important;font-size:14px;font-weight:650;text-align:right;border:0!important}
.sidebar>button .ico{width:20px;height:20px}
.sidebar>button:hover{background:rgba(255,255,255,.08)!important;color:#fff!important}
.sidebar>button.active{background:#C7F542!important;color:#28103F!important;font-weight:900;box-shadow:0 10px 25px rgba(111,153,23,.12)}
.side-bottom{margin-top:auto;padding:18px 7px 0;border-top:1px solid rgba(255,255,255,.12)}
.side-bottom .btn.secondary{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.16)}
.side-bottom>button{color:#D7C7E6;background:transparent}
.admin-main{min-width:0;padding:28px clamp(18px,3vw,44px) 35px!important;display:flex;flex-direction:column}
.admin-top{height:83px;border:1px solid rgba(40,16,63,.08);background:#fff;border-radius:22px;padding:16px 24px;box-shadow:0 12px 32px rgba(36,16,54,.035);display:flex;align-items:center;justify-content:space-between;gap:18px}
.admin-top small{font-size:12px;color:#8B7B96}
.admin-top h3{font-size:23px;font-weight:900;line-height:1.35}
.admin-top .avatar{background:#28103F;color:#C7F542;border:2px solid #EEE7F2}
.admin-main #view{flex:1}
.admin-main .page-head{padding-top:33px}
.admin-main .statgrid{gap:15px}
.admin-main .stat{background:#fff;border:1px solid rgba(40,16,63,.08);border-radius:23px;box-shadow:var(--shadow);padding:22px}
.admin-main .stat strong{font-size:clamp(24px,2.7vw,35px);font-weight:900}
.admin-main .card{border-radius:22px}
.admin-main .tabs{border-radius:15px}
.admin-main table{background:#fff;border-radius:18px;overflow:hidden}
.admin-main th{background:#F0EDF4;color:#4E3D5C}
.admin-main tr:hover td{background:#FCFBFD}
.admin-main .searchrow{gap:10px}
.admin-main .mobile-menu{background:#fff;border-color:#E6E0EB;border-radius:12px}
.admin-main .footer{margin-top:45px}
body:not(.admin) .auth-art img{object-fit:contain}

@media(max-width:1000px){
  .dream-nav{gap:2px}.dream-nav button{padding:10px 12px}

}

  .shell{padding-inline:16px!important}
  body.is-home{background:#11091D}
  .dream-header{height:68px;margin-top:10px;padding:8px 12px;border-radius:18px}
  .dream-brand{font-size:14px;gap:7px}
  .dream-emblem{width:43px;height:43px!important}
  .dream-nav{display:none}
  .dream-account{width:42px;height:42px;border-radius:13px}
  .dream-hero{margin-top:13px!important;min-height:490px;border-radius:23px;align-items:flex-end!important}
  .dream-headline{padding:29px 23px 78px;max-width:100%}
  .dream-headline h1{font-size:clamp(48px,12vw,76px)!important;letter-spacing:-3px!important;margin:20px 0 12px}
  .dream-headline p{font-size:15px!important;max-width:310px}
  .dream-photo img{object-position:32% center!important}
  .dream-photo:after{background:linear-gradient(0deg,rgba(15,6,26,.96),rgba(15,6,26,.58) 64%,rgba(15,6,26,.22))}
  .dream-photo>span{bottom:15px;left:13px;font-size:10px;padding:6px 10px}
  .dream-planner{width:calc(100% - 12px);margin:-35px auto 25px!important;padding:21px 17px!important;border-radius:24px!important}
  .dream-section-title h2{font-size:23px}.dream-icon{width:46px!important;height:46px!important}
  .dream-days button{min-width:82px;flex:0 0 82px}
  .dream-slots{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .dream-pricebar{padding:14px;align-items:flex-start;gap:10px}
  .dream-pricebar strong{font-size:20px}
  .dream-payment{font-size:11px}.dream-payment strong{font-size:11px}
  .dream-photo-note{padding-bottom:12px}
  .bottomnav{background:#fff;border-color:#EAE3EF;border-radius:19px 19px 0 0;padding:10px 8px max(12px,env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(14,7,24,.18)}
  .bottomnav button{background:transparent;color:#756683;opacity:1}
  .bottomnav button.active{color:#28103F}
  .bottomnav button.active .ico{stroke:#78A623}
  body.is-home .footer{padding-bottom:90px}
  .page-head{padding:27px 0 20px}.page-head h1{font-size:30px}
  .card{border-radius:18px;padding:19px}
  .admin-shell{display:block}
  .sidebar{display:none!important}
  .admin-main{padding:10px 13px 25px!important}
  .admin-top{height:76px;padding:12px 15px;border-radius:16px}
  .admin-top h3{font-size:17px}
  .admin-main .stat{padding:14px;border-radius:17px}
  .admin-main .statgrid{gap:9px}
  .admin-main .mobile-menu{min-width:125px;max-width:190px;font-size:12px}
}

:root{--night:#10091d;--purple:#341250;--purple2:#4d206a;--lime:#c6fa41;--ink:#1c1725;--paper:#f5f4f7;--muted:#746d7e;--line:#e5e1e9;--shadow:0 14px 35px rgba(35,17,53,.065)}
html{scroll-behavior:smooth}
body{font-family:Alexandria,Tahoma,Arial,sans-serif!important;letter-spacing:-.22px;background:#f5f4f8}
button,input,textarea,select{font-family:inherit!important;letter-spacing:inherit}
button,a,input,select,textarea{transition:background-color .22s,border-color .22s,color .22s,box-shadow .22s,transform .22s}
h1,h2,h3,h4,strong{font-family:Alexandria,Tahoma,Arial,sans-serif;letter-spacing:-.65px}
h1{font-weight:900;line-height:1.36}
h2{font-weight:850}
.site-header{height:84px;background:linear-gradient(110deg,#0e071b,#230f37 65%,#31134c);border-bottom:1px solid rgba(201,255,76,.18);box-shadow:0 9px 35px #15072322}
.site-header:after{content:'';position:absolute;inset:auto 0 0;height:1px;background:linear-gradient(90deg,transparent,#c6fa4177,transparent)}
.header-inner{max-width:1370px;padding-inline:33px}
.brand{gap:14px}
.brand-photo{height:55px;width:55px;border:1px solid #c6fa4147;border-radius:16px;box-shadow:0 0 0 5px #c6fa4109}
.brand-text strong{font-size:17px;font-weight:900;letter-spacing:-.9px}
.brand-text small{font-size:10px;color:#c6fa41;letter-spacing:2.1px}
.header-links{background:#ffffff0a;border:1px solid #ffffff12;border-radius:15px;padding:5px;gap:2px}
.header-links button{padding:11px 12px;font-size:12px;font-weight:650;color:#d9cedf;border-radius:11px}
.header-links button.active,.header-links button:hover{background:#c6fa41;color:#241234}
.ambient-pill{display:flex;align-items:center;gap:9px;color:#d4ff7a;font-size:10px;border:1px solid #c6fa4140;background:#c6fa410d;padding:10px 13px;border-radius:20px;white-space:nowrap}
.ambient-pill:before{content:'';height:6px;width:6px;border-radius:50%;background:#c6fa41;box-shadow:0 0 12px #c6fa41}
.account-chip{background:#f3f0f5;color:#2c143c;font-weight:800;border-radius:12px}
.account-chip:hover{background:#c6fa41}
.screen{max-width:1330px;padding:34px 30px 85px}
.screen-home{padding-top:26px}
.screen-narrow{max-width:980px}
.screen-title{margin:15px 0 29px}
.screen-title h1{font-size:clamp(29px,4vw,43px);font-weight:900}
.screen-title p{font-size:13px;color:#726879}
.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase;color:#583471}
.eyebrow:before{width:23px;height:3px;border-radius:10px}
.section-heading{margin:41px 0 22px}
.section-heading h2{font-size:clamp(19px,2.4vw,26px)}
.section-heading p{font-size:12px;margin-top:9px;line-height:1.9}
.card,.surface{border:1px solid #eae5ef;box-shadow:0 14px 35px #24103c09;border-radius:21px}
.btn{background:#c6fa41;color:#241234;border-color:#c6fa41;border-radius:12px;font-weight:800;font-size:12px;min-height:48px;padding:13px 21px}
.btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 10px 23px #c6fa413a}
.btn.purple{background:#341250;color:white}
.btn.purple:hover{box-shadow:0 10px 25px #34125033}
.btn.white{background:white;color:#351451;border-color:#e6e0eb}
.btn.ghost{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.4);color:white;backdrop-filter:blur(5px)}
.btn.sm{min-height:36px;padding:7px 13px}
.round-btn{display:none}
.home-hero{min-height:530px;align-items:center;border-radius:27px;background:#10091b;box-shadow:0 30px 70px #22103528}
.home-hero>img{object-position:center 55%;filter:saturate(1.12) contrast(1.05)}
.home-hero:before{background:linear-gradient(90deg,#12071d24 0%,#160921bd 49%,#0f0619f4 100%),linear-gradient(0deg,#180a26a8,transparent 60%)}
.home-hero:after{content:'';position:absolute;inset:15px;border:1px solid #ffffff17;border-radius:18px;pointer-events:none}
.home-hero-copy{margin:45px 64px;max-width:650px;position:relative}
.home-hero h1{font-size:clamp(38px,5.3vw,74px);font-weight:900;line-height:1.25;letter-spacing:-2px;text-shadow:0 4px 26px #0004}
.home-hero h1 span{color:#c6fa41}
.hero-pill{border:1px solid #c6fa4166;background:#201035ac;color:#daff95;font-size:11px;letter-spacing:.2px;padding:9px 15px;border-radius:10px}
.home-hero p{max-width:440px;line-height:2.15;color:#e7e0ea;font-size:13px;margin:23px 0 29px}
.hero-actions{gap:10px}
.hero-stamp{bottom:30px;left:30px;border-radius:9px;letter-spacing:.3px;color:#d5f9a8}
.quick-actions{padding-inline:32px;gap:14px;margin-top:-37px}
.action-card{min-height:126px;border-radius:18px;background:white;box-shadow:0 20px 43px #27113715;border:1px solid #e9e5ed;padding:22px}
.action-card.primary{background:#c6fa41;border-color:#c6fa41;color:#22112f}
.action-card.primary .action-icon{background:#22112f;color:#c6fa41}
.action-card .action-icon{background:#f3edf7;color:#3d1658;border-radius:13px;width:54px;height:54px}
.action-card strong{font-size:15px;font-weight:850}
.action-card small{font-size:11px}
.action-card>.ico{color:#a7a0af}
.home-sections{gap:28px;margin-top:29px}
.features{gap:13px}
.feature{background:white;border:1px solid #eae5ef;border-radius:16px;min-height:160px;padding:23px 9px;gap:13px;justify-content:center}
.feature .ico{width:30px;height:30px;color:#441b63;stroke-width:1.5}
.feature span{font-size:11px;font-weight:800}
.next-book{border-radius:21px;min-height:267px;padding:31px;background:radial-gradient(ellipse at 0% 120%,#69308b88,transparent 70%),linear-gradient(130deg,#31164d,#130b20)}
.next-book h2{font-size:25px;line-height:1.45}
.next-book strong{font-size:28px}
.photo-story{border-radius:22px;min-height:300px;margin-top:44px;background:#1b0d2b}
.photo-story img{height:305px;filter:saturate(1.1)}
.photo-story>div{padding:40px 48px;gap:15px}
.photo-story h2{font-size:clamp(25px,3.3vw,36px);letter-spacing:-1.2px}
.photo-story p{font-size:12px;line-height:2}
.site-footer{max-width:1330px;font-size:11px}
.site-footer-brand img{height:43px;width:43px;border-radius:12px}
.site-footer a{font-weight:750}
.booking-main{border-radius:19px}
.booking-top{background:radial-gradient(circle at left,#5d277b,#1b0e2c 70%);padding:28px 30px}
.booking-top h1{font-size:26px}
.booking-top p{font-size:12px;margin-top:7px;color:#d8c9e4}
.steps{padding:27px 33px 22px}
.step.active .step-num{background:#341250}
.step.done .step-num{background:#c6fa41}
.booking-body{padding:29px 33px}
.block-title{font-size:16px;font-weight:850}
.calendar-day{border-radius:10px;background:#f8f6fa;aspect-ratio:1.3;font-size:12px}
.calendar-day.active{background:#341250;box-shadow:0 7px 14px #34125024}
.calendar-day:not(:disabled):hover{border-color:#341250}
.time-button{border:1px solid #e1dce6;border-radius:10px;min-height:58px}
.time-button.active{background:#c6fa41;border-color:#c6fa41}
.time-button:not(:disabled):hover{border-color:#341250}
.booking-controls{padding:22px 32px}
.booking-controls .btn{min-width:185px}
.field input,.field textarea,.field select{border-color:#e2dce8;border-radius:11px;background:#fbfafc;font-size:12px}
.field span{font-weight:850}
.filter-tabs{background:#ede8f2}
.filter-tabs button.active{box-shadow:0 6px 18px #20102a14}
.booking-item{box-shadow:0 10px 23px #21122e0b;border-radius:17px}
.detail-photo{border-radius:19px}
.profile-hero{background:radial-gradient(circle at left,#552270,#1a0c29 72%)}
.profile-avatar{box-shadow:0 0 0 5px #c6fa411a}
.cup-card{border-top:4px solid #c6fa41}
.site-footer{color:#77717f}

.notification-badge{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;padding:0 4px;display:grid;place-items:center;border:2px solid #241039;border-radius:999px;background:#c6fa41;color:#261338;font-size:10px;font-weight:900;line-height:1}

    <p>حجز ساعة واحدة · ${money(b.price)}</p>

  </div>`).join('') : `<div class="sig-zero">${icon('check')}<p>كل الطلبات تمت مراجعتها.</p></div>`;
  return `<section class="sig-admin-dashboard">
    <div class="sig-admin-heading"><div><span class="sig-eyebrow">لوحة التحكم</span><h1>نظرة عامة</h1><p>${date(new Date())}</p></div><button type="button" class="sig-admin-new" onclick="newBooking()">${icon('plus')} حجز جديد</button></div>

    <div class="sig-admin-stats">
      <div class="sig-admin-stat primary"><span class="sig-stat-icon">${icon('calendar')}</span><small>حجوزات اليوم</small><strong>${todayBookings.length}</strong><span class="sig-stat-sub">إجمالي المواعيد</span></div>
      <div class="sig-admin-stat"><span class="sig-stat-icon pending">${icon('clock')}</span><small>بانتظار الموافقة</small><strong>${pending.length}</strong><span class="sig-stat-sub">طلب جديد</span></div>
      <div class="sig-admin-stat"><span class="sig-stat-icon done">${icon('check')}</span><small>الحجوزات المؤكدة</small><strong>${confirmed.length}</strong><span class="sig-stat-sub">اليوم</span></div>
    </div>

    <div class="sig-admin-columns">
      <section class="sig-admin-panel"><div class="sig-panel-head"><h2>مواعيد اليوم</h2><button type="button" onclick="go('bookings')">عرض الكل ${icon('arrow')}</button></div>${agendaItems}</section>
      <section class="sig-admin-panel"><div class="sig-panel-head"><h2>طلبات الحجز الجديدة</h2><span class="sig-pending-chip">${pending.length} بانتظارك</span></div>${requestItems}</section>
    </div>

    <div class="sig-admin-secondary">
      <div class="sig-mini-note">${icon('users')} <strong>${activeUsers}</strong> حساب مستخدم مسجل</div>
      <button type="button" class="sig-secondary-link" onclick="go('users')">إدارة المستخدمين ${icon('arrow')}</button>
    </div>
    ${DATA.resets.length ? `<div class="notice">عندك <strong>${DATA.resets.length}</strong> طلب استعادة كلمة مرور. <button class="textbtn" onclick="go('users')">مراجعة الطلبات</button></div>` : ''}
    ${monthlyReport()}
  </section>`;
}

function monthlyReport(){
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(reportMonth))reportMonth=today().slice(0,7);
  const localday=s=>new Date(+new Date(s)+3*3600000).toISOString().slice(0,10);
  const monthBookings=DATA.bookings.filter(b=>!b.match_id&&localday(b.start).slice(0,7)===reportMonth);
  const active=monthBookings.filter(b=>['confirmed','pending'].includes(b.status));
  const confirmed=monthBookings.filter(b=>b.status==='confirmed').length;
  const pending=monthBookings.filter(b=>b.status==='pending').length;
  const cancelled=monthBookings.filter(b=>['cancelled','rejected'].includes(b.status)).length;
  const expected=active.reduce((sum,b)=>sum+(Number(b.price)||0),0);
  const paid=active.reduce((sum,b)=>sum+(Number(b.paid)||0),0);
  const dailyCount=new Map();
  for(const b of active){const d=localday(b.start);dailyCount.set(d,(dailyCount.get(d)||0)+1)}
  const [year,month]=reportMonth.split('-').map(Number),days=new Date(year,month,0).getDate();
  const ceiling=Math.max(1,...dailyCount.values());
  const bars=Array.from({length:days},(_,i)=>{const num=i+1,key=reportMonth+'-'+String(num).padStart(2,'0'),count=dailyCount.get(key)||0;return `<div class="month-bar-col" title="${num} / ${month}: ${count} حجز"><span class="month-bar-count">${count||''}</span><div class="month-bar" style="height:${count?Math.max(10,Math.round(count/ceiling*100)):4}%"></div><small>${num}</small></div>`}).join('');
  const cards=[[monthBookings.length,'مجموع الطلبات خلال الشهر'],[confirmed,'الحجوزات المؤكدة'],[pending,'طلبات قيد المراجعة'],[cancelled,'ملغاة أو مرفوضة'],[money(expected),'قيمة الحجوزات الحالية'],[money(paid),'المبالغ المدفوعة المسجّلة'],[money(Math.max(0,expected-paid)),'المبلغ المتبقي']];
  return `<section class="month-report" aria-label="السجل الشهري للحجوزات">${head('السجل الشهري للحجوزات','تقارير المواعيد والأسعار والمبالغ المسجّلة خلال الشهر المختار.',`<label class="month-selector"><span>الشهر</span><input type="month" value="${reportMonth}" onchange="reportMonth=this.value;render()" aria-label="اختر شهر التقرير"></label>`)}<div class="month-stats">${cards.map(([num,label],i)=>`<div class="month-stat"><span>${label}</span><strong>${num}</strong></div>`).join('')}</div><div class="card month-chart"><div class="month-chart-heading"><strong>حركة الحجوزات يومياً</strong><small>الحجوزات المؤكدة والمعلّقة</small></div><div class="month-chart-scroll"><div class="month-chart-bars">${bars}</div></div></div><div class="month-report-note">الأرقام محسوبة حسب شهر موعد اللعب بتوقيت بغداد، وليست حسب تاريخ تسديد المبلغ. المدفوع هو مجموع ما سُجّل للحجوزات الحالية؛ ولا يشمل الطلبات الملغاة أو المحذوفة.</div>${head('سجل حجوزات الشهر','آخر 12 حجزاً بالشهر المحدد، مع السعر والمدفوع والحالة.')}<div class="card">${bookingTable(monthBookings.slice(0,12))}</div></section>`;
}
function bookingTable(list){return list.length?`<div class="tablewrap"><table><thead><tr><th>الحجز / الاسم</th><th>الموعد</th><th>السعر / المدفوع</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${list.map(b=>`<tr><td><strong>${esc(b.name)}</strong><br><small dir="ltr">${esc(b.phone)}</small><br><small>#${b.id.slice(0,8)} · ${{admin:'إدارة',user:'مستخدم',tournament:'بطولة'}[b.source]}</small>${b.note?`<br><small title="${esc(b.note)}">${esc(b.note.slice(0,50))}</small>`:''}</td><td>${date(b.start)}<br><strong>${time(b.start)} — ${time(b.end)}</strong></td><td>${money(b.price)}<br><small>مدفوع: ${money(b.paid)}</small></td><td>${badge(b.status)}</td><td><div class="actions">${b.status==='pending'?`<button class="btn small" onclick="bookingAction('${b.id}','confirmed')">موافقة</button><button class="btn secondary small" onclick="bookingAction('${b.id}','rejected')">رفض</button>`:''}${['pending','confirmed','blocked'].includes(b.status)&&!b.match_id?`<button class="btn secondary small" onclick="bookingAction('${b.id}','cancelled')">إلغاء</button>`:''}${b.source!=='tournament'&&b.status==='confirmed'?`<button class="btn secondary small" onclick="payment('${b.id}')">تسجيل دفع</button>`:''}${!b.match_id?`<button class="btn secondary small action-danger" onclick="deleteBooking('${b.id}')">${icon('trash')} حذف</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:empty('ماكو حجوزات بهذا القسم','أي حجز جديد راح يظهر هنا.')}
function bookingsPage(){let list=DATA.bookings.filter(b=>(!filterStatus||b.status===filterStatus)&&(!filterDay||new Date(+new Date(b.start)+3*3600000).toISOString().slice(0,10)===filterDay));return `${head('إدارة الحجوزات','إضافة الحجوزات الحضورية، قبول الطلبات وإغلاق الأوقات.',`<button class="btn" onclick="newBooking()">${icon('plus')} إضافة حجز</button>`)}<div class="searchrow"><label class="visually-hidden" for="dayfilter">تاريخ الحجز</label><input id="dayfilter" type="date" value="${filterDay}" onchange="filterDay=this.value;render()"><select aria-label="حالة الحجز" onchange="filterStatus=this.value;render()"><option value="">كل الحالات</option>${['pending','confirmed','rejected','cancelled','blocked'].map(s=>`<option value="${s}" ${filterStatus===s?'selected':''}>${statusNames[s]}</option>`).join('')}</select><button class="btn secondary" onclick="filterDay='';filterStatus='';render()">مسح الفلتر</button><button class="btn secondary" onclick="exportBookings()">تصدير CSV</button></div><div class="card">${bookingTable(list)}</div>`}
async function bookingAction(id,status){modal(status==='confirmed'?'تأكيد الحجز':'تحديث الحجز',`<p style="margin-bottom:22px">${status==='confirmed'?'تريد توافق على هذا الطلب وتأكد موعد الزبون؟':status==='rejected'?'رفض الطلب وإعادة الوقت متاحاً؟':'إلغاء الحجز وإعادة الوقت متاحاً؟'}</p><button id="doaction" class="btn wide">تأكيد الإجراء</button>`);$('#doaction').onclick=async e=>{e.target.disabled=true;try{await api('admin/booking',{id,status});closeModal();toast('تم تحديث الحجز');render()}catch(err){toast(err.message);e.target.disabled=false}}}
function payment(id){let b=DATA.bookings.find(x=>x.id===id);modal('تسجيل المبلغ المدفوع',`<p>قيمة الحجز ${money(b.price)}. أدخل إجمالي المدفوع لهذا الحجز.</p><form id="paymentform">${field('إجمالي المدفوع بالدينار','paid','number',b.paid,`required min="0" max="${b.price}" step="1"`)}<button class="btn wide" type="submit">حفظ المبلغ</button></form>`);$('#paymentform').onsubmit=e=>submit(e,async b=>{await api('admin/booking',{id,paid:+b.paid});closeModal();render();toast('تم تسجيل الدفع')})}
function deleteBooking(id){const b=DATA.bookings.find(x=>x.id===id);if(!b)return toast('الحجز غير موجود');modal('حذف الحجز نهائياً',`<div class="delete-warning">${icon('trash')}<strong>هذا الإجراء لا يمكن التراجع عنه</strong></div><p>الحجز باسم <strong>${esc(b.name)}</strong> بتاريخ <strong>${date(b.start)}</strong>، الساعة <strong>${time(b.start)}</strong>.</p><p class="notice">الحذف يزيل الحجز من السجل ويجعل الموعد متاحاً مجدداً. إذا تريد الحفاظ على التاريخ، استخدم «إلغاء» بدلاً منه. ننصح بتصدير نسخة احتياطية أولاً.</p><label class="delete-confirm"><input type="checkbox" id="confirmbookingdelete"> أؤكد حذف هذا الحجز بشكل نهائي</label><button class="btn wide action-danger-fill" type="button" id="deletebookingbtn" disabled>حذف الحجز نهائياً</button>`);$('#confirmbookingdelete').onchange=e=>$('#deletebookingbtn').disabled=!e.target.checked;$('#deletebookingbtn').onclick=async e=>{e.target.disabled=true;try{await api('admin/booking-delete',{id});closeModal();toast('تم حذف الحجز');await render()}catch(err){toast(err.message);e.target.disabled=false}}}
function newBooking(){modal('إضافة حجز أو إغلاق وقت',`<form id="newbooking"><label class="field"><span>النوع</span><select name="kind" id="bookingkind"><option value="booking">حجز حضوري / هاتفي</option><option value="block">إغلاق للصيانة أو مناسبة</option></select></label><div id="guestfields">${field('الاسم الثلاثي','name','text','','required')}${field('رقم الهاتف','phone','tel','','required dir="ltr"')}</div>${field('اليوم','day','date',today(),`required min="${today()}"`)}<label class="field"><span>الوقت المتاح</span><select name="start" id="adminslots" required><option value="">اختار الساعة</option></select></label><label class="field"><span>ملاحظات / سبب الإغلاق</span><textarea name="note" maxlength="500"></textarea></label><button class="btn wide" type="submit">حفظ بالجدول</button></form>`);$('#bookingkind').onchange=e=>{$('#guestfields').hidden=e.target.value==='block';$('#guestfields').querySelectorAll('input').forEach(x=>x.required=e.target.value!=='block')};const load=async d=>{try{let r=await api('slots?day='+d);$('#adminslots').innerHTML='<option value="">اختار الساعة</option>'+r.slots.filter(s=>s.status==='available').map(s=>`<option value="${s.start}">${time(s.start)} ${s.nextDay?'(فجر اليوم التالي)':''}</option>`).join('')}catch(e){toast(e.message)}};$('#newbooking [name=day]').onchange=e=>load(e.target.value);load(today());$('#newbooking').onsubmit=e=>submit(e,async b=>{let block=b.kind==='block';await api('admin/bookings',{...b,block,name:block?'إغلاق إدارة الملعب':b.name,phone:block?'07000000000':b.phone});closeModal();render();toast('تم حفظ الموعد')})}
function usersPage(){let users=DATA.users.filter(u=>!userSearch||(u.name+' '+u.phone).includes(userSearch));return `${head('حسابات المستخدمين','كل الحسابات، حالات الحظر وطلبات استعادة كلمة المرور.')}<input id="usersearch" placeholder="ابحث بالاسم أو رقم الهاتف…" aria-label="البحث عن مستخدم" value="${esc(userSearch)}" style="margin-bottom:20px">${DATA.resets.length?`<div class="card" style="margin-bottom:22px"><h3>طلبات استعادة كلمة المرور</h3>${DATA.resets.map(r=>`<div class="summary-row"><span dir="ltr">${esc(r.phone)}</span><small>${date(r.created)}</small><div class="actions">${DATA.users.find(u=>u.phone===r.phone)?`<button class="btn small" onclick="resetPassword('${DATA.users.find(u=>u.phone===r.phone).id}')">تعيين كلمة مؤقتة</button>`:'<small>لا يوجد حساب بهذا الرقم</small>'}<button class="btn secondary small" onclick="dismissReset('${r.id}')">إغلاق الطلب</button></div></div>`).join('')}</div>`:''}<div class="card tablewrap"><table><thead><tr><th>المستخدم</th><th>الهاتف</th><th>تاريخ التسجيل</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>${users.map(u=>`<tr><td><strong>${esc(u.name)}</strong><br><small>${u.role==='admin'?'مدير الموقع':'مستخدم'}</small></td><td dir="ltr">${esc(u.phone)}</td><td>${date(u.created)}</td><td>${badge(u.banned?'محظور':'نشط')}${u.ban_reason?`<br><small>${esc(u.ban_reason)}</small>`:''}</td><td>${u.role!=='admin'?`<div class="actions"><button class="btn secondary small" onclick="editUser('${u.id}')">تعديل</button><button class="btn secondary small" onclick="banUser('${u.id}')">${u.banned?'فك الحظر':'حظر الحساب'}</button><button class="btn secondary small" onclick="resetPassword('${u.id}')">استعادة كلمة المرور</button><button class="btn secondary small action-danger" onclick="deleteUser('${u.id}')">${icon('trash')} حذف</button></div>`:'<small>حساب الإدارة</small>'}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد نتائج</td></tr>'}</tbody></table></div>`}
function editUser(id){const u=DATA.users.find(x=>x.id===id);modal('تعديل حساب المستخدم',`<form id="edituserform">${field('الاسم الثلاثي','name','text',u.name,'required')}${field('رقم الهاتف','phone','tel',u.phone,'required dir="ltr"')}<p class="notice">يتم إنهاء جلسات المستخدم بعد تعديل الحساب. أبلغه برقم الدخول إذا تغيّر.</p><button class="btn wide" type="submit">حفظ المعلومات</button></form>`);$('#edituserform').onsubmit=e=>submit(e,async b=>{await api('admin/user',{...b,id,action:'edit'});closeModal();render();toast('تم تعديل الحساب')})}
function banUser(id){const u=DATA.users.find(x=>x.id===id);modal(u.banned?'فك الحظر':'حظر الحساب',`<p>${esc(u.name)} — ${esc(u.phone)}</p><form id="banform">${!u.banned?field('سبب الحظر','reason','text','','required maxlength="300"'):''}<p class="notice">${u.banned?'يستطيع المستخدم تسجيل الدخول والحجز مجدداً.':'يتم إنهاء جلسات المستخدم ومنعه من الدخول والحجز. حجوزاته الحالية تبقى بالجدول ويمكنك إلغاءها بشكل منفصل.'}</p><button class="btn wide" type="submit">تأكيد ${u.banned?'فك الحظر':'الحظر'}</button></form>`);$('#banform').onsubmit=e=>submit(e,async b=>{await api('admin/user',{id,action:'ban',banned:!u.banned,reason:b.reason});closeModal();render();toast('تم تحديث حالة الحساب')})}
function resetPassword(id){const u=DATA.users.find(x=>x.id===id);modal('تعيين كلمة مرور مؤقتة',`<p>${esc(u.name)} · ${esc(u.phone)}</p><p class="notice">تحقق من هوية صاحب الحساب أولاً، وبلغه بالكلمة بشكل خاص. سيُطلب منه تغييرها عند الدخول.</p><form id="resetform">${field('كلمة المرور المؤقتة','password','password','','required minlength="8" autocomplete="new-password"')}<button class="btn wide" type="submit">تعيين الكلمة المؤقتة</button></form>`);$('#resetform').onsubmit=e=>submit(e,async b=>{await api('admin/user',{id,action:'reset',password:b.password});closeModal();render();toast('تم تعيين كلمة مؤقتة وإنهاء الجلسات القديمة')})}
function deleteUser(id){const u=DATA.users.find(x=>x.id===id);if(!u||u.role==='admin')return toast('لا يمكن حذف حساب الإدارة');const related=DATA.bookings.filter(b=>b.user_id===id).length;modal('حذف حساب المستخدم',`<div class="delete-warning">${icon('trash')}<strong>حذف دائم لحساب المستخدم</strong></div><p>سيتم حذف حساب <strong>${esc(u.name)}</strong> المرتبط بالرقم <strong dir="ltr">${esc(u.phone)}</strong>، وإنهاء جلساته وحذف تفاعلاته وتعليقاته من المنتدى.</p><p class="notice">حجوزات المستخدم الحالية (${related}) تبقى بسجل الملعب ما لم تحدد حذفها أيضاً. فرق البطولات تبقى في النتائج ولكن دون ربط بحسابه.</p><label class="delete-confirm"><input type="checkbox" id="deleteuserbookings"> حذف الحجوزات المرتبطة (${related}) أيضاً</label><label class="delete-confirm"><input type="checkbox" id="confirmuserdelete"> أفهم أن حذف الحساب لا يمكن التراجع عنه</label><button class="btn wide action-danger-fill" type="button" id="deleteuserbtn" disabled>حذف الحساب نهائياً</button>`);$('#confirmuserdelete').onchange=e=>$('#deleteuserbtn').disabled=!e.target.checked;$('#deleteuserbtn').onclick=async e=>{e.target.disabled=true;try{await api('admin/user-delete',{id,deleteBookings:$('#deleteuserbookings').checked});closeModal();toast('تم حذف الحساب وإنهاء جلساته');await render()}catch(err){toast(err.message);e.target.disabled=false}}}
async function dismissReset(id){try{await api('admin/reset-dismiss',{id});render()}catch(e){toast(e.message)}}
function cupsPage(){return `${head('بطولات الملعب','تسجيل الفرق، القرعة، جدولة المباريات وإدخال النتائج.',`<button class="btn" onclick="newCup()">${icon('plus')} بطولة جديدة</button>`)}${DATA.tournaments.length?`<div class="grid3">${DATA.tournaments.map((t,i)=>`<div class="card cup-card"><div class="cup-number">TOURNAMENT / ${String(i+1).padStart(2,'0')}</div>${icon('cup')}${badge(t.status)}<h3>${esc(t.name)}</h3><p>${({league:'دوري نقاط',knockout:'خروج مغلوب',groups:'مجموعات وخروج مغلوب'})[t.format]}</p><p>${DATA.teams.filter(x=>x.tournament_id===t.id&&x.status==='approved').length} فرق مقبولة · ${DATA.teams.filter(x=>x.tournament_id===t.id&&x.status==='pending').length} طلبات</p><button class="btn" onclick="manageCup('${t.id}')">إدارة البطولة ${icon('arrow')}</button><button class="btn secondary small action-danger cup-delete-btn" onclick="deleteCup('${t.id}')">${icon('trash')} حذف البطولة</button></div>`).join('')}</div>`:empty('بعد ماكو بطولة','أنشئ بطولة وحدد نظامها، بعدها افتح التسجيل للفرق.')}`}
function deleteCup(id){
  const t=DATA.tournaments.find(x=>x.id===id);
  if(!t)return toast('البطولة غير موجودة');
  const teams=DATA.teams.filter(x=>x.tournament_id===id).length;
  const matches=DATA.matches.filter(x=>x.tournament_id===id).length;
  const slots=DATA.bookings.filter(b=>DATA.matches.some(m=>m.tournament_id===id&&m.id===b.match_id)).length;
  modal('حذف البطولة نهائياً',`<div class="delete-warning">${icon('trash')}<strong>هذا الإجراء دائم ولا يمكن التراجع عنه</strong></div><p>سيتم حذف بطولة <strong>${esc(t.name)}</strong> وكل ما يرتبط بها: <strong>${teams} فرق</strong> و<strong>${matches} مباريات</strong>، وتحرير <strong>${slots} مواعيد</strong> من جدول الملعب.</p><p class="notice">حجوزات الزبائن المستقلة عن البطولة ستبقى كما هي. يُفضّل تصدير نسخة احتياطية قبل الحذف.</p><label class="delete-confirm"><input type="checkbox" id="confirmcupdelete"> أفهم أن نتائج البطولة وفرقها ومبارياتها ستُحذف نهائياً</label><button class="btn wide action-danger-fill" id="deletecupbtn" type="button" disabled>حذف البطولة نهائياً</button>`);
  $('#confirmcupdelete').onchange=e=>$('#deletecupbtn').disabled=!e.target.checked;

  let result;
  if(op==='forum'&&!write){
    const sorted=[...d.posts].sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||String(b.created).localeCompare(String(a.created)));
    result={posts:await Promise.all(sorted.map(async p=>{
      const reactions=Array.isArray(p.reactions)?p.reactions:[];
      const counts={like:0,fire:0,heart:0};
      for(const r of reactions)if(Object.hasOwn(counts,r.kind))counts[r.kind]++;
      return {id:p.id,title:p.title||'',body:p.body||'',image:p.imageRef?await resolveAsset(p.imageRef):'',imageRef:p.imageRef||'',
        created:p.created,updated:p.updated||'',author:p.author||'إدارة الملعب',pinned:!!p.pinned,
        counts,myReaction:reactions.find(r=>r.userId===me?.id)?.kind||'',
        comments:(Array.isArray(p.comments)?p.comments:[]).map(c=>({id:c.id,name:c.name,text:c.text,created:c.created})),
        commentCount:Array.isArray(p.comments)?p.comments.length:0};
    }))};
  }else if(op==='forum/react'&&write){
    auth();if(!Object.hasOwn(FORUM_REACTIONS,b.kind))throw Error('تفاعل غير مدعوم');
    const p=post(b.id);p.reactions??=[];
    const previous=p.reactions.find(r=>r.userId===me.id);
    p.reactions=p.reactions.filter(r=>r.userId!==me.id);
    if(previous?.kind!==b.kind)p.reactions.push({userId:me.id,kind:b.kind});
    result={ok:true};
  }else if(op==='forum/comment'&&write){
    auth();const p=post(b.id),txt=safeText(b.text,700);
    if(txt.length<2)throw Error('اكتب تعليق من حرفين على الأقل');
    p.comments??=[];if(p.comments.length>=500)throw Error('وصل المنشور إلى الحد الأقصى للتعليقات');
    if(p.comments.some(c=>c.userId===me.id&&Date.now()-new Date(c.created).getTime()<10000))throw Error('انتظر قليلاً قبل إضافة تعليق آخر');
    p.comments.push({id:localId(),userId:me.id,name:me.name,text:txt,created:localNow()});
    localAddNotification(d,{forRole:'admin',title:'تعليق جديد في منتدى الملعب',body:me.name+' علّق على '+(p.title||'منشور إدارة الملعب'),view:'forum',refId:p.id});
    result={ok:true};
  }else if(op==='admin/forum'&&write){
    auth(true);
    const action=b.action;
    if(action==='create'||action==='edit'){
      const title=safeText(b.title,120),body=safeText(b.body,5000),imageRef=imgRef(b.imageRef);
      if(!body&&!imageRef)throw Error('اكتب نص المنشور أو أضف صورة');
      if(action==='create'){
        const newPost={id:localId(),title,body,imageRef,pinned:!!b.pinned,author:me.name,
          created:localNow(),updated:'',reactions:[],comments:[]};
        d.posts.push(newPost);
        localAddNotification(d,{forRole:'user',title:'منشور جديد من إدارة الملعب',body:title||body.slice(0,105)||'صورة جديدة من الملعب',view:'forum',refId:newPost.id});
      }else{
        const p=post(b.id);
        Object.assign(p,{title,body,imageRef,pinned:!!b.pinned,updated:localNow()});
      }
    }else if(action==='pin'){post(b.id).pinned=!!b.pinned}
    else if(action==='delete'){d.posts=d.posts.filter(p=>p.id!==b.id);d.notifications=(d.notifications||[]).filter(n=>n.refId!==b.id)}
    else if(action==='deleteComment'){
      const p=post(b.id);p.comments=(p.comments||[]).filter(c=>c.id!==b.commentId);
    }else throw Error('عملية غير صالحة');
    d.audit.unshift({id:localId(),actor:me.name,action:'المنتدى: '+action,created:localNow()});
    d.audit=d.audit.slice(0,1000);
    result={ok:true};
  }else throw Error('عملية غير معروفة');
  if(write)localSave(d);
  return result;
}
api=cloudCall;

function forumDate(value){return new Intl.DateTimeFormat('ar-IQ',{timeZone:'Asia/Baghdad',day:'numeric',month:'long',year:'numeric'}).format(new Date(value))}
function forumCard(post,admin=false){
  const comments=post.comments||[];
  return `<article class="forum-post card" id="post-${esc(post.id)}">
    <div class="forum-post-top">
      <span class="forum-author-mark"><img src="logo.png?v=5" class="forum-logo" alt="شعار الإدارة"></span>
      <div class="forum-author-details"><strong>إدارة ملعب الأحلام</strong><small>${forumDate(post.created)}${post.updated?' · تم التعديل':''}</small></div>
      ${post.pinned?`<span class="forum-pin">${icon('pin')} منشور مثبّت</span>`:''}
    </div>
    ${post.title?`<h3 class="forum-post-title">${esc(post.title)}</h3>`:''}
    ${post.body?`<p class="forum-post-body">${esc(post.body)}</p>`:''}
    ${post.image?`<img class="forum-post-image" src="${esc(post.image)}" loading="lazy" alt="${esc(post.title||'صورة منشور إدارة الملعب')}">`:''}
    <div class="forum-stats"><span>${Object.values(post.counts).reduce((a,b)=>a+b,0)} تفاعل</span><span>${comments.length} تعليق</span></div>
    <div class="forum-reactions">${Object.entries(FORUM_REACTIONS).map(([key,r])=>
      `<button ${admin?'disabled':''} class="forum-reaction ${post.myReaction===key?'chosen':''}" onclick="forumReact('${esc(post.id)}','${key}')" aria-pressed="${post.myReaction===key}"><span class="forum-reaction-icon">${icon(r.icon)}</span> ${r.label} <strong>${post.counts[key]||0}</strong></button>`
    ).join('')}</div>
    <details class="forum-comments" ${admin?'open':''}><summary>التعليقات (${comments.length})</summary>
      <div class="forum-comments-list">${comments.map(c=>`<div class="forum-comment"><span class="comment-avatar">${esc(c.name.charAt(0))}</span>
        <div><strong>${esc(c.name)}</strong><p>${esc(c.text)}</p><small>${forumDate(c.created)}</small></div>
        ${admin?`<button class="comment-delete" onclick="forumAdminDeleteComment('${post.id}','${c.id}')" aria-label="حذف التعليق">${icon('close')}</button>`:''}</div>`).join('')||'<p class="forum-empty-comments">ماكو تعليقات بعد. كن أول واحد يكتب!</p>'}</div>
      ${admin?'':`<form class="forum-comment-form" onsubmit="forumComment(event,'${post.id}')">
        <input name="text" maxlength="700" required minlength="2" placeholder="${ME?'اكتب تعليقك هنا...':'سجّل دخولك حتى تعلق'}" aria-label="تعليق جديد">
        <button type="submit" class="btn sm">إرسال ${icon('arrow')}</button></form>`}
    </details>
    ${admin?`<div class="forum-admin-actions">
      <button class="btn secondary small" onclick="forumAdminCompose('${post.id}')">تعديل المنشور</button>
      <button class="btn secondary small" onclick="forumAdminPin('${post.id}',${!post.pinned})">${post.pinned?'إلغاء التثبيت':'تثبيت بالأعلى'}</button>
      <button class="btn secondary small forum-delete-action" onclick="forumAdminDelete('${post.id}')">حذف</button>
    </div>`:''}
  </article>`;
}

  const r=await api('forum');return `
    <section class="forum-banner"><div><span class="forum-banner-kicker">DREAMS / COMMUNITY</span>
      <h1>آخر الأخبار،<br><em>من قلب الملعب.</em></h1><p>إعلانات الإدارة، أخبار البطولات، صور المباريات وكل جديد يهم اللاعبين.</p></div>
      <img src="logo.png?v=5" alt="شعار ملعب الأحلام الرياضي"></section>
    <div class="forum-layout"><div><div class="section-heading"><div><h2>منتدى الملعب</h2><p>منشورات الإدارة الرسمية مرتبة من الأحدث؛ المثبّتة تظهر أولاً.</p></div><span class="forum-post-count">${r.posts.length} منشور</span></div>
      <div class="forum-feed">${r.posts.map(p=>forumCard(p)).join('')||

        <div class="forum-side-item">${icon('check')} منشورات موثوقة من الإدارة</div>
        <div class="forum-side-item">${icon('cup')} أخبار البطولات والمنافسات</div>
        <div class="forum-side-item">${icon('users')} مساحة لتفاعل اللاعبين</div>
      </div></aside></div>`;
}
async function forumReact(id,kind){
  if(!ME){AUTH_RETURN='forum';return go('auth')}
  try{await api('forum/react',{id,kind});await render()}catch(e){toast(e.message)}
}
async function forumComment(e,id){
  e.preventDefault();if(!ME){AUTH_RETURN='forum';return go('auth')}
  const button=e.target.querySelector('[type=submit]');button.disabled=true;
  try{await api('forum/comment',{id,text:e.target.elements.text.value});toast('تم نشر تعليقك');await render()}
  catch(err){toast(err.message);button.disabled=false}
}
async function forumAdminPage(){
  const data=await api('forum');FORUM_ADMIN_CACHE=data.posts;
  return `<div class="page-head"><span class="eyebrow">إدارة المحتوى</span><h1>منتدى الملعب</h1><p>انشر صور الملعب والأخبار والتحضيرات، وثبّت المهم وتابع تفاعل اللاعبين.</p></div>
    <div class="forum-admin-heading"><div><strong>${data.posts.length} منشور</strong><small>النشر والتعديل محصور بالإدارة</small></div>
      <button class="btn" onclick="forumAdminCompose()">إنشاء منشور ${icon('plus')}</button></div>
    <div class="forum-admin-feed">${data.posts.map(p=>forumCard(p,true)).join('')||
      empty('ماكو منشورات بعد','اضغط «إنشاء منشور» حتى تنشر أول خبر رسمي بالمنتدى.')}</div>`;
}
function forumAdminCompose(id=''){
  const post=FORUM_ADMIN_CACHE.find(p=>p.id===id);
  modal(post?'تعديل المنشور':'منشور جديد',`<form id="forumAdminForm">
    ${field('عنوان المنشور (اختياري)','title','text',post?.title||'','maxlength="120" placeholder="مثلاً: بطولة الأسبوع القادم"')}
    <label class="field"><span>نص المنشور</span><textarea name="body" maxlength="5000" rows="6" placeholder="اكتب الخبر أو الإعلان...">${esc(post?.body||'')}</textarea></label>
    ${post?.image?`<div class="forum-existing-image"><img src="${esc(post.image)}" alt="صورة المنشور الحالية"><small>الصورة الحالية</small></div>`:''}
    <label class="field"><span>${post?.image?'استبدال الصورة (اختياري)':'إضافة صورة (اختياري)'}</span>
      <input id="forumImageFile" type="file" accept="image/png,image/jpeg,image/webp"></label>
    ${post?.image?'<label class="forum-checkbox"><input type="checkbox" name="removeImage"> حذف الصورة الحالية</label>':''}
    <label class="forum-checkbox"><input type="checkbox" name="pinned" ${post?.pinned?'checked':''}> تثبيت المنشور أعلى المنتدى</label>
    <p class="notice">المحتوى يظهر للجميع، والتفاعل والتعليقات متاحة لأصحاب الحسابات.</p>
    <button class="btn wide" type="submit">${post?'حفظ التعديل':'نشر الآن'} ${icon('check')}</button>
  </form>`);
  $('#forumAdminForm').onsubmit=async e=>{
    e.preventDefault();const button=e.target.querySelector('[type=submit]');button.disabled=true;
    try{
      const fields=values(e.target);let imageRef=post?.imageRef||'';
      const file=$('#forumImageFile').files[0];
      if(file){
        if(file.size>8*1024*1024)throw Error('الصورة يجب أن تكون أقل من 8 ميگابايت');
        const data=new FormData();data.append('file',file);
        imageRef=(await api('admin/upload',data)).url;
      }else if(fields.removeImage)imageRef='';
      await api('admin/forum',{action:post?'edit':'create',id:post?.id,title:fields.title,body:fields.body,imageRef,pinned:!!fields.pinned});
      closeModal();toast(post?'تم تحديث المنشور':'تم نشر المنشور');await render();
    }catch(err){toast(err.message);button.disabled=false}
  };
}
async function forumAdminPin(id,pinned){
  try{await api('admin/forum',{action:'pin',id,pinned});await render()}catch(e){toast(e.message)}
}
async function forumAdminDelete(id){
  if(!confirm('متأكد تريد حذف المنشور مع جميع تعليقاته وتفاعلاته؟'))return;
  try{await api('admin/forum',{action:'delete',id});toast('تم حذف المنشور');await render()}catch(e){toast(e.message)}
}
async function forumAdminDeleteComment(id,commentId){
  if(!confirm('حذف هذا التعليق؟'))return;
  try{await api('admin/forum',{action:'deleteComment',id,commentId});await render()}catch(e){toast(e.message)}
}

</script><script id="signature-admin-nav-v9">
/* Add a four-destination mobile bar while retaining the full desktop sidebar. */
(() => {
  const destinations = [
    ['dashboard','home','الرئيسية'],
    ['bookings','calendar','الحجوزات'],
    ['users','users','المستخدمون'],
    ['settings','settings','الإعدادات']
  ];
  const root = document.getElementById('app');
  if (!root) return;
  function syncNav() {
    let nav = document.getElementById('sig-admin-bottom');
    if (!document.querySelector('.admin-shell')) {
      nav?.remove();
      return;
    }
    if (!nav) {
      nav = document.createElement('nav');
      nav.id = 'sig-admin-bottom';
      nav.setAttribute('aria-label','قائمة الإدارة على الهاتف');
      document.body.appendChild(nav);
    }
    nav.innerHTML = destinations.map(([view,ic,label]) => `<button type="button" class="${VIEW===view?'active':''}" onclick="go('${view}')">${icon(ic)}<span>${label}</span></button>`).join('');
  }
  const observer = new MutationObserver(syncNav);
  observer.observe(root, {childList:true});
  syncNav();
})();
